<!doctype html>
<html>
<head><meta charset="utf-8"><title>Enseignant - Emplois du temps</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<main>
  <h1>Vue Enseignant</h1>
  <p>Entrez votre email pour voir votre emploi du temps</p>
  <input id="email" placeholder="email">
  <button id="go">Voir</button>
  <div id="list"></div>
</main>
<script>
document.getElementById('go').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value;
  const users = await (await fetch('/api/users')).json();
  const user = users.find(u=>u.email===email);
  if(!user){ alert('Aucun enseignant trouvé'); return; }
  const res = await fetch('/api/schedule?teacher_id='+user.id);
  const data = await res.json();
  document.getElementById('list').innerHTML = data.length ? data.map(e=>`<div style="border:1px solid #ddd;padding:8px;margin:6px">Séance #${e.id} — classe:${e.class_id} sujet:${e.subject_id} salle:${e.room_id} créneau:${e.timeslot_id}</div>`).join('') : '<small>Aucune séance</small>';
});
</script>
</body>
</html>
